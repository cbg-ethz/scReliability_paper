# Conda environment for the scReliability paper analysis.
# Versions pinned to those used to produce the published results.
#   conda env create -f environment.yml && conda activate screliability
name: screliability
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=2.2
  - pandas=2.3
  - scipy=1.15
  - scanpy=1.11
  - anndata=0.11
  - matplotlib=3.10
  - statsmodels=0.14
  - scikit-learn=1.7
  - openpyxl=3.1        # read the Ahlmann-Eltze Source Data .xlsx files
  - joblib=1.5
  - seaborn=0.13
  - pymupdf=1.27        # provides `fitz`, used only by the figure-crop helper
  - pip
  - pip:
      # Used only by scripts/05_shared_specific/ (the shared-axis vs specific-residual GSEA behind
      # Supplementary Figure 2). Both GSEA calls are seeded, so results are reproducible at these versions.
      - gseapy==1.3.0
      - blitzgsea==1.3.54
